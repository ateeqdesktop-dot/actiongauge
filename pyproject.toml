[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actiongauge"
version = "0.1.0"
description = "Deterministic security, resilience, and cost audits for GitHub Actions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Manus AI"}]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
actiongauge = "actiongauge.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.setuptools.packages.find]
include = ["actiongauge*"]
